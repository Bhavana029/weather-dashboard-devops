
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Weather Dashboard webhook test -->

    <div class="container">

        <h1>Weather Dashboard DevOps</h1>

        <p class="subtitle">
            Check weather information for any city
        </p>

        <div class="search-box">

            <input
                type="text"
                id="city"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>

        <p id="message"></p>

        <div class="weather-card">

            <h2 id="cityName">Search Your City</h2>

            <div class="weather-icon" id="icon">
                🌤️
            </div>

            <h1 id="temperature">-- °C</h1>

            <p id="condition">
                Weather condition
            </p>

            <div class="weather-details">

                <div class="detail">

                    <span>💧</span>

                    <p>Humidity</p>

                    <h3>
                        <span id="humidity">--</span>%
                    </h3>

                </div>

                <div class="detail">

                    <span>💨</span>

                    <p>Wind Speed</p>

                    <h3>
                        <span id="wind">--</span> km/h
                    </h3>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
